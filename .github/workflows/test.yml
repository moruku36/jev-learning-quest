# PR と main への push ごとに自動テスト (npm test) を実行する
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Claude 添削のテスト（[12]）に @anthropic-ai/sdk が必要
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Observe live reading sources (read-only, informational)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const { main, TARGET_FILE, WEEK_STATE_FILE } = require('./scripts/update-readings');
          const snapshot = file => fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : null;
          const catalogBefore = snapshot(TARGET_FILE);
          const stateBefore = snapshot(WEEK_STATE_FILE);
          const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'reading-live-observation-'));
          const observationState = path.join(tempDir, 'unused-week-state.json');
          (async () => {
            try {
              await main({ dryRun: true, weekStateFile: observationState });
            } finally {
              assert.equal(snapshot(TARGET_FILE), catalogBefore, 'Live observation changed the catalog');
              assert.equal(snapshot(WEEK_STATE_FILE), stateBefore, 'Live observation changed production week state');
              assert.equal(fs.existsSync(observationState), false, 'Dry run wrote observation state');
              fs.rmSync(tempDir, { recursive: true, force: true });
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

  learning-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Install browser test tools (CI only)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node test_learning_ui.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-ui-evidence
          path: ui-evidence
          if-no-files-found: ignore
