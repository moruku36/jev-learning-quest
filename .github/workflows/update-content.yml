# AI・クラウド・セキュリティ学習教材を週次で自動更新するワークフロー
name: update-content

on:
  schedule:
    # 毎週月曜 00:17 UTC (日本時間 09:17)
    - cron: '17 0 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-reading-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-readings:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update AI / Cloud / Security readings
        id: update
        run: node scripts/update-readings.js

      - name: Run verification tests
        run: npm test

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/content/ai-readings.js
          if [ -f .github/state/weekly-content-update.json ]; then
            git add .github/state/weekly-content-update.json
          fi
          if git diff --staged --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "chore(content): weekly update AI/Cloud/Security readings [skip ci]"
            git push origin main
          fi
